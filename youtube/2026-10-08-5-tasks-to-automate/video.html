<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=block" rel="stylesheet">
<style>html,body{margin:0;background:#0B1426;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
// Scene start times (seconds), set from the voiceover's pauses. Last value = end.
const T = [0, 9.2, 21.0, 31.3, 40.9, 48.4, 56.4, 63.4, 71];
const W = 1920, H = 1080;
const C = { bg:'#0B1426', card:'#14223D', card2:'#1B2C4D', teal:'#12A4AE', teal2:'#5FD3D9', amber:'#FFB547', red:'#FF5C6C', green:'#3DDC97', text:'#F4F7FB', muted:'#8FA3BF' };
const cv = document.getElementById('c'), x = cv.getContext('2d');
const F = (w, s) => `${w} ${s}px Inter, Arial, sans-serif`;
const cl = (v, a=0, b=1) => Math.max(a, Math.min(b, v));
const eo = v => 1 - Math.pow(1 - cl(v), 3);               // ease out
const back = v => { v = cl(v); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3*Math.pow(v-1,3) + c1*Math.pow(v-1,2); };
const ph = (t, a, d=0.6) => eo((t - a) / d);               // 0→1 starting at a

function rr(px, py, w, h, r, fill, stroke) {
  x.beginPath(); x.roundRect(px, py, w, h, r);
  if (fill) { x.fillStyle = fill; x.fill(); }
  if (stroke) { x.strokeStyle = stroke; x.lineWidth = 3; x.stroke(); }
}
function txt(s, px, py, font, col, align='left', alpha=1) {
  x.save(); x.globalAlpha *= alpha; x.font = font; x.fillStyle = col; x.textAlign = align; x.textBaseline = 'middle'; x.fillText(s, px, py); x.restore();
}
function check(cx, cy, s, col, p) {          // animated check mark
  x.save(); x.strokeStyle = col; x.lineWidth = s * 0.18; x.lineCap = 'round'; x.lineJoin = 'round';
  x.beginPath(); const pts = [[-0.45,0],[-0.12,0.32],[0.5,-0.35]];
  const total = 2; let left = p * total;
  x.moveTo(cx + pts[0][0]*s, cy + pts[0][1]*s);
  for (let i = 1; i < 3 && left > 0; i++) {
    const k = Math.min(1, left); left -= 1;
    const [ax, ay] = pts[i-1], [bx, by] = pts[i];
    x.lineTo(cx + (ax + (bx-ax)*k)*s, cy + (ay + (by-ay)*k)*s);
  }
  x.stroke(); x.restore();
}
function bg(t) {
  x.fillStyle = C.bg; x.fillRect(0, 0, W, H);
  // slow drifting glow
  const gx = 1500 + Math.sin(t*0.2)*200, gy = 300 + Math.cos(t*0.15)*120;
  const g = x.createRadialGradient(gx, gy, 0, gx, gy, 900);
  g.addColorStop(0, 'rgba(18,164,174,0.22)'); g.addColorStop(1, 'rgba(18,164,174,0)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // dot grid
  x.fillStyle = 'rgba(143,163,191,0.08)';
  for (let i = 0; i < 40; i++) for (let j = 0; j < 23; j++) x.fillRect(i*50 + 20, j*50 + 15 + ((t*8) % 50), 3, 3);
}
function chrome(t, idx) {
  // brand tag
  x.save(); x.beginPath(); x.arc(92, 82, 22, 0, Math.PI*2); x.fillStyle = C.teal; x.fill();
  txt('G', 92, 84, F(800, 26), '#fff', 'center');
  txt('GROW SUCCESS ONLINE', 128, 84, F(700, 22), C.muted); x.restore();
  // step dots for tasks 1–5
  if (idx >= 1 && idx <= 5) for (let i = 1; i <= 5; i++) {
    const on = i <= idx, cx = W - 340 + i*52;
    x.beginPath(); x.arc(cx, 82, on ? 12 : 9, 0, Math.PI*2);
    x.fillStyle = i === idx ? C.amber : on ? C.teal : 'rgba(143,163,191,0.3)'; x.fill();
  }
}
// Shared header for task scenes: big number + title, left column
function header(lt, n, title, sub) {
  const a = ph(lt, 0, 0.7);
  x.save(); x.globalAlpha = a; x.translate(-60*(1-a), 0);
  txt(String(n).padStart(2,'0'), 140, 330, F(900, 200), C.teal, 'left', 0.9);
  let fs = 76; x.font = F(800, fs); while (x.measureText(title).width > 820) { fs -= 2; x.font = F(800, fs); }
  txt(title, 140, 500, F(800, fs), C.text);
  sub.forEach((s, i) => txt(s, 140, 590 + i*52, F(500, 38), C.muted, 'left', ph(lt, 0.4 + i*0.2)));
  x.restore();
}

// ---- Scenes ----
function s0(lt, d) {
  const a = back((lt - 0.2) / 0.8);
  txt('AI FOR SMALL BUSINESS', W/2, 330, F(700, 34), C.teal2, 'center', ph(lt, 0.1));
  x.save(); x.translate(W/2, 470); x.scale(0.6 + 0.4*a, 0.6 + 0.4*a);
  txt('5 Tasks to Automate', 0, 0, F(900, 120), C.text, 'center', cl(a));
  x.restore();
  x.save(); x.translate(W/2, 610);
  const b = back((lt - 0.7) / 0.8); x.scale(b, b);
  rr(-200, -60, 400, 120, 60, C.amber); txt('FIRST', 0, 4, F(900, 80), C.bg, 'center');
  x.restore();
  // ticking clock losing hours
  const p = ph(lt, 2.2, 0.8); if (p > 0) {
    x.save(); x.globalAlpha = p;
    txt('hours lost every week →', W/2 - 40, 820, F(600, 40), C.muted, 'right');
    const hrs = Math.min(10, Math.floor((lt - 2.2) * 3));
    for (let i = 0; i < 10; i++) rr(W/2 + i*46, 800, 34, 40, 8, i < hrs ? C.red : 'rgba(143,163,191,0.2)');
    x.restore();
  }
}
function s1(lt, d) {
  header(lt, 1, 'Answer the same questions', ['AI chat on your website', 'handles hours, prices, bookings']);
  const px = 1080, py = 200, a = ph(lt, 0.3);
  x.save(); x.globalAlpha = a; rr(px, py, 680, 720, 36, C.card);
  rr(px, py, 680, 90, [36,36,0,0], C.card2);
  txt('Website chat', px + 40, py + 46, F(700, 30), C.text);
  // moon + 2:00 AM
  txt('🌙 2:00 AM', px + 640, py + 46, F(700, 28), C.amber, 'right');
  const msgs = [
    [false, 'Are you open Saturday?', 1.0],
    [true, 'Yes! 9am to 2pm. Want to book?', 2.2],
    [false, 'Yes, 11am please', 3.6],
    [true, 'Booked ✓ See you Saturday!', 4.8],
  ];
  msgs.forEach(([bot, m, at], i) => {
    const p = back((lt - at) / 0.5); if (p <= 0) return;
    x.save(); const by = py + 140 + i*120;
    x.font = F(600, 30); const w = x.measureText(m).width + 60;
    const bx = bot ? px + 40 : px + 640 - w;
    x.translate(bx + w/2, by + 40); x.scale(p, p); x.translate(-(bx + w/2), -(by + 40));
    rr(bx, by, w, 80, 28, bot ? C.teal : C.card2);
    txt(m, bx + 30, by + 42, F(600, 30), C.text); x.restore();
  });
  const lp = ph(lt, 6.2); if (lp > 0) {
    x.save(); x.globalAlpha = lp; rr(px + 140, py + 630, 400, 64, 32, C.amber);
    txt('New lead → you', px + 340, py + 664, F(800, 30), C.bg, 'center'); x.restore();
  }
  x.restore();
}
function s2(lt, d) {
  header(lt, 2, 'Automatic follow-ups', ['reply in under a minute', 'check in again on day 3']);
  const a = ph(lt, 0.3); x.save(); x.globalAlpha = a;
  // form card
  rr(1060, 230, 320, 380, 28, C.card);
  txt('Contact form', 1100, 280, F(700, 28), C.text);
  [340, 410, 480].forEach((yy, i) => rr(1100, yy, 240, 44, 10, C.card2));
  const sp = ph(lt, 1.2, 0.3); rr(1100, 550, 240, 44, 22, sp > 0.5 ? C.green : C.teal);
  txt(sp > 0.5 ? 'Sent ✓' : 'Submit', 1220, 573, F(700, 24), C.bg, 'center');
  // flying envelope
  const fp = eo((lt - 1.6) / 1.0);
  if (fp > 0) {
    const ex = 1400 + fp*240, ey = 420 - Math.sin(fp*Math.PI)*120;
    rr(ex - 50, ey - 34, 100, 68, 10, C.amber);
    x.beginPath(); x.moveTo(ex - 50, ey - 34); x.lineTo(ex, ey + 4); x.lineTo(ex + 50, ey - 34);
    x.strokeStyle = C.bg; x.lineWidth = 5; x.stroke();
  }
  // timeline
  const tp = ph(lt, 2.8, 0.8);
  x.globalAlpha = a * tp;
  x.strokeStyle = 'rgba(143,163,191,0.4)'; x.lineWidth = 6;
  x.beginPath(); x.moveTo(1080, 790); x.lineTo(1080 + 680*tp, 790); x.stroke();
  [[1080, '0:47', 'Personal reply', C.green, 3.0], [1760, 'Day 3', 'Quiet? Check in', C.amber, 4.2]].forEach(([cx, top, lab, col, at]) => {
    const p = back((lt - at) / 0.5); if (p <= 0) return;
    x.beginPath(); x.arc(cx, 790, 18*p, 0, Math.PI*2); x.fillStyle = col; x.fill();
    txt(top, cx, 730, F(800, 40), col, 'center', cl(p));
    txt(lab, cx, 850, F(600, 28), C.text, 'center', cl(p));
  });
  x.restore();
}
function s3(lt, d) {
  header(lt, 3, 'Meeting notes, done', ['record, summarize, list actions', 'nothing slips through the cracks']);
  const a = ph(lt, 0.3); x.save(); x.globalAlpha = a;
  rr(1040, 200, 760, 720, 36, C.card);
  // recording dot
  const pulse = 0.6 + 0.4*Math.sin(lt*6);
  x.beginPath(); x.arc(1090, 256, 12, 0, Math.PI*2); x.fillStyle = `rgba(255,92,108,${pulse})`; x.fill();
  txt('Call with client', 1116, 258, F(700, 30), C.text);
  // waveform
  for (let i = 0; i < 40; i++) {
    const h = 12 + Math.abs(Math.sin(i*0.7 + lt*5))*44;
    rr(1080 + i*17, 330 - h/2, 9, h, 4, C.teal);
  }
  txt('Summary', 1080, 430, F(800, 36), C.amber, 'left', ph(lt, 1.6));
  ['Send proposal by Friday', 'Share pricing for 3 tiers', 'Book follow-up call'].forEach((s, i) => {
    const at = 2.2 + i*0.9, p = ph(lt, at, 0.5); if (p <= 0) return;
    x.save(); x.globalAlpha *= p; x.translate(30*(1-p), 0);
    rr(1080, 480 + i*110, 680, 86, 18, C.card2);
    check(1130, 523 + i*110, 40, C.green, eo((lt - at - 0.2) / 0.5));
    txt(s, 1180, 524 + i*110, F(600, 32), C.text); x.restore();
  });
  x.restore();
}
function s4(lt, d) {
  header(lt, 4, 'Invoices chase themselves', ['connect your accounting tool', 'reminders go out on their own']);
  const a = ph(lt, 0.3); x.save(); x.globalAlpha = a;
  x.save(); x.translate(1400, 540); x.rotate(-0.03);
  rr(-300, -320, 600, 640, 30, '#F4F7FB');
  txt('INVOICE #1042', -250, -250, F(800, 36), C.bg);
  [-160, -100, -40].forEach(yy => rr(-250, yy, 380, 22, 8, '#D6DEEA'));
  txt('$1,250.00', 250, 60, F(900, 54), C.bg, 'right');
  // stamp
  const sp = back((lt - 1.2) / 0.5);
  const paid = lt > 4.2;
  if (sp > 0) {
    x.save(); x.translate(0, 190); x.rotate(-0.18); const s = 1.6 - 0.6*cl(sp); x.scale(s, s); x.globalAlpha = cl(sp);
    const col = paid ? C.green : C.red;
    x.strokeStyle = col; x.lineWidth = 8; x.beginPath(); x.roundRect(-190, -50, 380, 100, 14); x.stroke();
    txt(paid ? 'PAID' : 'OVERDUE', 0, 4, F(900, 60), col, 'center'); x.restore();
  }
  x.restore();
  // reminder toasts
  ['Reminder sent · Day 1', 'Reminder sent · Day 7'].forEach((s, i) => {
    const p = back((lt - 2.0 - i*1.0) / 0.5); if (p <= 0) return;
    x.save(); x.globalAlpha *= cl(p); x.translate(0, 40*(1-p));
    rr(1150 - i*40, 830 + i*0, 500, 80, 40, C.teal);
    txt('✉  ' + s, 1400 - i*40, 872, F(700, 30), '#fff', 'center'); x.restore();
  });
  x.restore();
}
function s5(lt, d) {
  header(lt, 5, 'One post, many pieces', ['write it once a week', 'AI turns it into the rest']);
  const a = ph(lt, 0.3); x.save(); x.globalAlpha = a;
  rr(1300, 200, 240, 300, 22, C.amber);
  txt('1 post', 1420, 350, F(900, 44), C.bg, 'center');
  const items = [['Captions', 1110], ['Emails', 1420], ['Short videos', 1730]];
  items.forEach(([lab, cx], i) => {
    const p = eo((lt - 1.4 - i*0.4) / 0.7); if (p <= 0) return;
    x.strokeStyle = 'rgba(95,211,217,0.6)'; x.lineWidth = 5; x.setLineDash([12, 12]);
    x.beginPath(); x.moveTo(1420, 500); x.lineTo(1420 + (cx - 1420)*p, 500 + 180*p); x.stroke(); x.setLineDash([]);
    const b = back((lt - 1.9 - i*0.4) / 0.5); if (b <= 0) return;
    x.save(); x.translate(cx, 780); x.scale(b, b);
    rr(-140, -100, 280, 200, 22, C.card2, C.teal);
    txt(lab, 0, 4, F(800, 34), C.text, 'center'); x.restore();
  });
  x.restore();
}
function s6(lt, d) {
  txt('You don’t need all five today.', W/2, 250, F(800, 70), C.text, 'center', ph(lt, 0));
  const tasks = ['Questions', 'Follow-ups', 'Meeting notes', 'Invoices', 'Content'];
  const pick = 1, chosen = lt > 2.4;
  tasks.forEach((s, i) => {
    const p = back((lt - 0.6 - i*0.15) / 0.5); if (p <= 0) return;
    const cx = 300 + i*330, sel = chosen && i === pick;
    x.save(); x.translate(cx, 540); const sc = sel ? 1 + 0.12*eo((lt - 2.4)/0.4) : 1; x.scale(p*sc, p*sc);
    x.globalAlpha *= chosen && !sel ? 0.35 : 1;
    rr(-145, -70, 290, 140, 28, sel ? C.amber : C.card, sel ? null : C.teal);
    txt(s, 0, 4, F(800, 34), sel ? C.bg : C.text, 'center'); x.restore();
  });
  if (chosen) {
    const p = ph(lt, 2.7);
    txt('↑ start with the one that eats most of your time', 300 + pick*330 - 120, 700, F(700, 36), C.amber, 'left', p);
    txt('Automate it this week. Then the next.', W/2, 880, F(700, 48), C.teal2, 'center', ph(lt, 4.4));
  }
}
function s7(lt, d) {
  const p = back((lt - 0.2) / 0.7);
  x.save(); x.translate(W/2, 420); x.scale(p, p);
  x.beginPath(); x.arc(0, 0, 120, 0, Math.PI*2); x.fillStyle = C.teal; x.fill();
  txt('G', 0, 8, F(800, 130), '#fff', 'center'); x.restore();
  txt('Grow Success Online', W/2, 620, F(800, 64), C.text, 'center', ph(lt, 0.6));
  const b = back((lt - 1.2) / 0.6);
  if (b > 0) {
    const clicked = lt > 2.6;
    x.save(); x.translate(W/2, 760); x.scale(b, b);
    rr(-230, -55, 460, 110, 55, clicked ? '#3A4A66' : '#FF3B3B');
    txt(clicked ? 'Subscribed ✓' : 'SUBSCRIBE', 0, 4, F(900, 46), '#fff', 'center'); x.restore();
  }
  txt('Next: set up task #1, step by step', W/2, 920, F(600, 38), C.muted, 'center', ph(lt, 3.0));
}
const SC = [s0, s1, s2, s3, s4, s5, s6, s7];

function draw(t) {
  bg(t);
  let i = SC.length - 1; while (i > 0 && t < T[i]) i--;
  const lt = t - T[i], d = T[i+1] - T[i];
  x.save();
  // fade between scenes
  x.globalAlpha = cl(lt / 0.35) * cl((d - lt) / 0.35 + (i === SC.length - 1 ? 1 : 0));
  SC[i](lt, d); x.restore();
  chrome(t, i);
}
function loop() { draw(performance.now() / 1000); requestAnimationFrame(loop); }
document.fonts.load(F(800, 40)).then(() => requestAnimationFrame(loop));
</script></body></html>
