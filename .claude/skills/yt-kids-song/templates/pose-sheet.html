<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Fredoka;src:url('fonts/Fredoka.ttf')}body{margin:0}</style></head><body>
<canvas id="c" width="2400" height="1200"></canvas>
<script src="tamara.js"></script>
<script>
// Pose sheet for approval: the reference picture + all 8 poses with mouth shapes.
const c = document.getElementById('c').getContext('2d');
const ref = new Image(); ref.src = '../../../../youtube/kids-songs/2026-10-09-phases-of-the-moon/tamara-reference.webp';
window.ready = new Promise(r => { ref.onload = ref.onerror = r; }).then(() => document.fonts.load('600 30px Fredoka')).then(() => {
  c.fillStyle = '#FFF8EC'; c.fillRect(0, 0, 2400, 1200);
  c.drawImage(ref, 20, 80, 420, 630);
  c.font = '600 30px Fredoka'; c.fillStyle = '#2B2768'; c.textAlign = 'center';
  c.fillText('reference', 230, 50);
  const poses = ['idle', 'sing', 'wave', 'point', 'clap', 'cheer', 'dance', 'open'], mouths = ['X', 'B', 'C', 'D', 'E', 'X', 'C', 'X'];
  poses.forEach((p, i) => { const x = 590 + (i % 4) * 470, y = i < 4 ? 590 : 1170;
    c.save(); c.translate(x, y - 30); c.scale(0.56, 0.56); drawTamara(c, { t: 1.3, pose: p, lt: 2, beat: 0.5, mouth: mouths[i], look: 0.3 }); c.restore();
    c.fillStyle = '#2B2768'; c.fillText(p, x, y - 4); });
  c.font = '600 26px Fredoka'; c.fillText('mouths: X rest · B small · C open · D wide · E round', 230, 1150);
});
</script></body></html>
