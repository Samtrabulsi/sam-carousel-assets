<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;800;900&display=block" rel="stylesheet">
<style>
:root{--bg:#0B1426;--glow:#12404a;--accent:#FFB547;--alert:#FF5C6C;--kicker:#5FD3D9;--card:#14223D;--text:#F4F7FB}
body{margin:0;width:1280px;height:720px;background:radial-gradient(circle at 80% 30%,var(--glow) 0,var(--bg) 60%);font-family:Inter,Arial,sans-serif;overflow:hidden;position:relative;color:var(--text)}
.bgimg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.55}
.bgimg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0,rgba(11,20,38,.85) 45%,rgba(11,20,38,.2) 100%)}
.k{position:absolute;left:64px;top:70px;font-size:40px;font-weight:800;color:var(--kicker);letter-spacing:2px;z-index:3}
.t{position:absolute;left:60px;top:140px;font-size:var(--tsize,100px);font-weight:900;line-height:1;letter-spacing:-3px;z-index:3;max-width:var(--tmax,700px)}
.t span{color:var(--accent)}
.tag{position:absolute;left:56px;bottom:56px;background:var(--alert);color:#fff;font-size:38px;font-weight:900;padding:14px 28px;border-radius:18px;transform:rotate(-2deg);z-index:4}
.list{position:absolute;right:50px;top:80px;display:flex;flex-direction:column;gap:18px;z-index:3}
.i{background:var(--card);border:4px solid var(--alert);border-radius:22px;padding:16px 24px;font-size:34px;font-weight:800;min-width:300px;white-space:nowrap;display:flex;gap:14px}
.i b{color:var(--alert)} .i.good{border-color:#3DDC97} .i.good b{color:#3DDC97}
.face{position:absolute;bottom:0;z-index:1;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 30%,#000 80%,transparent 100%),linear-gradient(to bottom,transparent 0,#000 12%);-webkit-mask-composite:source-in;mask-composite:intersect}
.big{position:absolute;right:60px;bottom:30px;font-size:280px;font-weight:900;color:var(--accent);line-height:1;z-index:2}
</style></head><body><script>
// T = thumbnail.json. layouts: "list" (title + checklist on the right), "face" (title + cut-out photo on the right),
// "combo" (title + photo in the middle + list), "number" (title + giant number/year)
const T = window.T, L = T.layout || 'list', b = document.body;
const css = (k, v) => document.documentElement.style.setProperty(k, v);
Object.entries(T.colors || {}).forEach(([k, v]) => css('--' + k, v));
if (T.bg) b.insertAdjacentHTML('beforeend', `<div class="bgimg" style="background-image:url('${T.bg}')"></div>`);
if (T.kicker) b.insertAdjacentHTML('beforeend', `<div class="k">${T.kicker}</div>`);
const title = (T.lines || []).map(l => l.replace(/\*(.+?)\*/g, '<span>$1</span>')).join('<br>');
if (L === 'face') { css('--tmax', '640px'); }
b.insertAdjacentHTML('beforeend', `<div class="t">${title}</div>`);
if (T.size) css('--tsize', T.size + 'px');
if (T.number) b.insertAdjacentHTML('beforeend', `<div class="big">${T.number}</div>`);
if (T.face) b.insertAdjacentHTML('beforeend', `<img class="face" src="${T.face}" style="${L === 'face' ? 'right:0;height:720px' : 'left:520px;height:660px'}">`);
if (T.items && L !== 'face') b.insertAdjacentHTML('beforeend', `<div class="list">${T.items.map(s => `<div class="i ${T.good ? 'good' : ''}"><b>${T.good ? '✓' : '✗'}</b>${s}</div>`).join('')}</div>`);
if (T.tag) b.insertAdjacentHTML('beforeend', `<div class="tag">${T.tag}</div>`);
</script></body></html>
